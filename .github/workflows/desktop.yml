name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
            arch: arm64
          - runner: macos-15-intel
            target: macos-amd64
            arch: amd64
          - runner: windows-2025
            target: windows-amd64
            arch: amd64
    env:
      TITEN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      TITEN_TEST_CREDENTIALS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(go env GOARCH)" = "$EXPECTED_ARCH"
      - name: Test and vet macOS
        if: runner.os == 'macOS'
        shell: bash
        run: sh scripts/verify.sh
      - name: Test and vet Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run github.com/egoist/mygo/cmd/mygo vet .
          exit $LASTEXITCODE
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: sh scripts/build-macos.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Validate packaged binaries
        shell: bash
        env:
          TARGET_OS: ${{ runner.os }}
        run: |
          go run ./cmd/packagecheck -dir dist -os "$TARGET_OS" -arch "$(go env GOARCH)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Titen-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
