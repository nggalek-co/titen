name: Desktop builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
            arch: arm64
          - runner: macos-15-intel
            target: macos-amd64
            arch: amd64
          - runner: windows-2025
            target: windows-amd64
            arch: amd64
    env:
      TITEN_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      TITEN_TEST_CREDENTIALS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$(go env GOARCH)" = "$EXPECTED_ARCH"
      - name: Test and vet macOS
        if: runner.os == 'macOS'
        shell: bash
        run: sh scripts/verify.sh
      - name: Test and vet Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run github.com/egoist/mygo/cmd/mygo vet .
          exit $LASTEXITCODE
      - name: Verify consecutive Windows installer upgrades
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: ./scripts/verify-windows-upgrade.ps1
      - name: Create temporary signing keychain for macOS builds
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/titen-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "::add-mask::$keychain_password"
          {
            echo "TITEN_CODESIGN_KEYCHAIN=$keychain"
            echo "TITEN_CODESIGN_KEYCHAIN_PASSWORD=$keychain_password"
          } >> "$GITHUB_ENV"
      - name: Import the persistent signing identity for tagged macOS builds
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        env:
          TITEN_SIGNING_CERTIFICATE: ${{ secrets.TITEN_SIGNING_CERTIFICATE }}
          TITEN_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.TITEN_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          . scripts/signing-config.sh
          if [ -z "${TITEN_SIGNING_CERTIFICATE:-}" ] || [ -z "${TITEN_SIGNING_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::Tagged macOS builds require TITEN_SIGNING_CERTIFICATE and TITEN_SIGNING_CERTIFICATE_PASSWORD so every release uses the same signing identity."
            exit 1
          fi
          keychain="$TITEN_CODESIGN_KEYCHAIN"
          p12="$RUNNER_TEMP/titen-signing.p12"
          certificate="$RUNNER_TEMP/titen-signing-cert.pem"
          printf '%s' "$TITEN_SIGNING_CERTIFICATE" | tr -d '[:space:]' | openssl base64 -d -A > "$p12"
          if [ ! -s "$p12" ]; then
            echo "::error::TITEN_SIGNING_CERTIFICATE is not valid base64 PKCS#12 data."
            exit 1
          fi
          if ! openssl pkcs12 -in "$p12" -nokeys -passin "pass:$TITEN_SIGNING_CERTIFICATE_PASSWORD" >/dev/null 2>&1 \
            && ! openssl pkcs12 -legacy -in "$p12" -nokeys -passin "pass:$TITEN_SIGNING_CERTIFICATE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The signing PKCS#12 cannot be opened with TITEN_SIGNING_CERTIFICATE_PASSWORD."
            exit 1
          fi
          if ! openssl pkcs12 -in "$p12" -clcerts -nokeys -passin "pass:$TITEN_SIGNING_CERTIFICATE_PASSWORD" -out "$certificate" 2>/dev/null; then
            openssl pkcs12 -legacy -in "$p12" -clcerts -nokeys -passin "pass:$TITEN_SIGNING_CERTIFICATE_PASSWORD" -out "$certificate" 2>/dev/null
          fi
          security import "$p12" -k "$keychain" -P "$TITEN_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$TITEN_CODESIGN_KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$certificate" >/dev/null
          identities="$(security find-identity -v -p codesigning "$keychain")"
          if ! printf '%s\n' "$identities" | grep -Fq "\"$TITEN_CODESIGN_IDENTITY\""; then
            echo "::error::The signing certificate identity must be \"$TITEN_CODESIGN_IDENTITY\"."
            exit 1
          fi
          echo "TITEN_CODESIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        env:
          TITEN_SIGNING_EPHEMERAL: ${{ github.ref_type != 'tag' && '1' || '0' }}
          TITEN_CODESIGN_CI: '1'
        run: sh scripts/build-macos.sh
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.MYGO_UPDATER_PRIVATE_KEY || '' }}
        run: ./scripts/build-windows.ps1
      - name: Validate packaged binaries
        shell: bash
        env:
          TARGET_OS: ${{ runner.os }}
        run: |
          go run ./cmd/packagecheck -dir dist -os "$TARGET_OS" -arch "$(go env GOARCH)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Titen-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.sha256
            dist/windows-amd64/Titen Setup *.exe
            dist/windows-amd64/Titen Setup *.exe.sha256
            dist/windows-amd64/*.tar.gz
            dist/windows-amd64/update-*.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/titen-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/titen-signing.p12" "$RUNNER_TEMP/titen-signing-cert.pem"

  publish-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'Titen-*' --dir release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "Titen $GITHUB_REF_NAME" --generate-notes
          fi
      - name: Upload installers and archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if ((${#assets[@]} == 0)); then
            echo 'No release assets were downloaded' >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
